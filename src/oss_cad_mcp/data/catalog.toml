# Curated metadata for OSS CAD Suite binaries.
# Entries missing here are discovered at runtime from <suite>/bin and receive
# conservative defaults. Keep summaries short: they are shown to the agent.

[tools.yosys]
family = "synthesis"
summary = "RTL synthesis, netlist manipulation, and formal front-end."
risk = "executes_code"
tags = ["verilog", "systemverilog", "vhdl", "json", "formal", "synthesis"]
recommended_tool = "cad_synthesize"
help_args = ["-h"]
version_args = ["--version"]
examples = [
  "cad_synthesize(target='ice40', sources=SourceSet(files=['rtl/top.sv']), top='top')",
  "cad_tool_help('yosys')",
]

[tools.yosys-abc]
family = "synthesis"
summary = "ABC logic synthesis and optimization engine used by Yosys."
risk = "executes_code"
internal = true
tags = ["abc", "optimization", "internal"]

[tools.slang]
family = "lint"
summary = "SystemVerilog compiler and linter with JSON diagnostics."
risk = "read_only"
tags = ["systemverilog", "lint", "json", "ast"]
recommended_tool = "cad_check"
version_args = ["--version"]
examples = ["cad_check(engine='slang', level='lint')"]

